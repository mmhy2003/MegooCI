# GoReleaser config for megooci-agent.
#
# Usage:
#   (snapshot)  goreleaser release --clean --snapshot --skip=publish
#   (release)   git tag v0.1.0 && git push --tags && goreleaser release --clean
#
# Cross-compiles Linux/macOS/Windows binaries for amd64 + arm64 and publishes
# them to the GitHub release, a Homebrew tap, and a multi-arch Docker image.

version: 2

project_name: megooci-agent

before:
  hooks:
    - go mod tidy

builds:
  - id: megooci-agent
    main: ./cmd/megooci-agent
    binary: megooci-agent
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Windows/arm64 builds are possible; leave them in.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/megooci/megooci-agent/internal/version.Version={{ .Version }}
      - -X github.com/megooci/megooci-agent/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/megooci/megooci-agent/internal/version.Date={{ .CommitDate }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
