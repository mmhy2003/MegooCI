<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MegooCI logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a0033"/>
      <stop offset="55%"  stop-color="#0a0118"/>
      <stop offset="100%" stop-color="#000008"/>
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00fff0"/>
      <stop offset="100%" stop-color="#00b8ff"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pinkGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Dark cyberpunk background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Faint grid wash (terminal vibe) -->
  <g stroke="#ff2d95" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Magenta orbit rings (CI loop) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#ff2d95" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ff2d95" stroke-opacity="0.40" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- Pink glow halo behind the M -->
  <path d="M 148 370 L 148 152 L 256 282 L 364 152 L 364 370"
        stroke="#ff2d95" stroke-opacity="0.55"
        stroke-width="62" stroke-linecap="round" stroke-linejoin="round"
        fill="none" filter="url(#pinkGlow)"/>

  <!-- Neon cyan M -->
  <path d="M 148 370 L 148 152 L 256 282 L 364 152 L 364 370"
        stroke="url(#mGrad)"
        stroke-width="54" stroke-linecap="round" stroke-linejoin="round"
        fill="none" filter="url(#neonGlow)"/>

  <!-- Magenta CI accent nodes -->
  <circle cx="148" cy="152" r="14" fill="#ff2d95" filter="url(#neonGlow)"/>
  <circle cx="364" cy="370" r="14" fill="#ff2d95" filter="url(#neonGlow)"/>
</svg>
