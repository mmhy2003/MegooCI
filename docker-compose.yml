# =============================================================================
# MegooCI — production-ready base compose file
#
# This file targets a single-node production deployment. For local development
# with hot-reload, bind mounts, and dev Dockerfiles, layer the dev overrides:
#
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Or run production as-is:
#
#     docker compose up -d
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-megooci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-megooci}
      POSTGRES_DB: ${POSTGRES_DB:-megooci}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-megooci}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: megooci-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - megooci_storage:/var/lib/megooci
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    image: megooci-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - megooci_storage:/var/lib/megooci
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A app.tasks.celery_app worker --loglevel=info

  celery-beat:
    image: megooci-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - megooci_storage:/var/lib/megooci
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: megooci-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  megooci_storage:
